name: Deploy to GitHub Pages (with key injection)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 公開するのは地図の資産だけ（許可リスト）。受信API（tracking-worker/）・文書・設定は Pages に載せない
      - name: Build the public folder (allowlist)
        run: |
          set -euo pipefail
          mkdir -p dist-pages
          for f in index.html index-google.html index-senshu.html track.html manifest.json sw.js \
                   apple-touch-icon.png icon-192.png icon-512.png .nojekyll \
                   manifest-senshu.json icon-senshu-192.png icon-senshu-512.png icon-senshu-maskable-512.png apple-touch-icon-senshu.png \
                   fest-vehicle-tracking.js fest-schedule.js fest-advanced.js fest-floor.js \
                   fest-3d.json fest-dem.json fest-rail.json fest-shiro.json fest-terr.json \
                   fest-map-style.json fest-map-style-dark.json; do
            cp "$f" dist-pages/
          done
          ls -a dist-pages

      - name: Inject API keys from secrets (repo に実キーは残さない)
        env:
          GMAP_KEY: ${{ secrets.GMAP_KEY }}
          MAPBOX_KEY: ${{ secrets.MAPBOX_KEY }}
          FEST_MAP_ID: ${{ secrets.FEST_MAP_ID }}
        run: |
          python3 - <<'PY'
          import os
          p = 'dist-pages/index-google.html'
          s = open(p, encoding='utf-8').read()
          gk = os.environ.get('GMAP_KEY', '').strip()      # 貼り付け時の空白・改行を除く（文字列に改行が入ると地図が動かない）
          mk = os.environ.get('MAPBOX_KEY', '').strip()
          fm = os.environ.get('FEST_MAP_ID', '').strip()   # 本祭支援ツールの3D（ベクター地図）の Map ID
          s = s.replace('__GMAP_KEY__',  gk)
          s = s.replace('__MAPBOX_KEY__', mk)
          s = s.replace('__FEST_MAP_ID__', fm)
          open(p, 'w', encoding='utf-8').write(s)
          # 注入確認（キー値そのものはログに出さない）
          print('gmap injected:', '__GMAP_KEY__' not in s and bool(gk))
          print('mapbox injected:', '__MAPBOX_KEY__' not in s and bool(mk))
          print('fest map id injected:', '__FEST_MAP_ID__' not in s and bool(fm))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
