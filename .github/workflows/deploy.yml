name: Deploy to GitHub Pages (with key injection)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 公開するのは地図の資産だけ（許可リスト）。受信API（tracking-worker/）・文書・設定は Pages に載せない
      - name: Build the public folder (allowlist)
        run: |
          set -euo pipefail
          mkdir -p dist-pages
          for f in index.html index-google.html index-senshu.html track.html manifest.json sw.js \
                   apple-touch-icon.png icon-192.png icon-512.png .nojekyll \
                   cad-alpha.js fest-vehicle-tracking.js \
                   fest-3d.json fest-dem.json fest-rail.json fest-shiro.json fest-terr.json \
                   fest-map-style.json fest-map-style-dark.json; do
            cp "$f" dist-pages/
          done
          ls -a dist-pages

      - name: Inject API keys from secrets (repo に実キーは残さない)
        env:
          GMAP_KEY: ${{ secrets.GMAP_KEY }}
          MAPBOX_KEY: ${{ secrets.MAPBOX_KEY }}
        run: |
          python3 - <<'PY'
          import os
          p = 'dist-pages/index-google.html'
          s = open(p, encoding='utf-8').read()
          s = s.replace('__GMAP_KEY__',  os.environ.get('GMAP_KEY', ''))
          s = s.replace('__MAPBOX_KEY__', os.environ.get('MAPBOX_KEY', ''))
          open(p, 'w', encoding='utf-8').write(s)
          # 注入確認（キー値そのものはログに出さない）
          print('gmap injected:', '__GMAP_KEY__' not in s and bool(os.environ.get('GMAP_KEY')))
          print('mapbox injected:', '__MAPBOX_KEY__' not in s and bool(os.environ.get('MAPBOX_KEY')))
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
